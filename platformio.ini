; PlatformIO Multi-Environment Configuration File

; -------------------------------------------------------------
; Environment 1: ESP32 Transmitter (Connected on COM3)
; -------------------------------------------------------------
[env:esp32_tx]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_src_filter = +<../esp32_tx/src/>

; -------------------------------------------------------------
; Environment 2: Arduino Nano Receiver (Connected on COM4)
; -------------------------------------------------------------
[env:nano_rx]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_src_filter = +<../nano_rx/src/>

; -------------------------------------------------------------
; Environment 3: STM32 Robot Board (BlackPill F401CC)
; -------------------------------------------------------------
[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
build_flags = 
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
monitor_speed = 115200
build_src_filter = +<*> -<../esp32_tx/> -<../nano_rx/>
